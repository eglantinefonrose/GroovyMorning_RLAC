services:
  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: radiodb
      POSTGRES_USER: radiouser
      POSTGRES_PASSWORD: radiopass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radiouser -d radiodb"]
      interval: 5s
      timeout: 5s
      retries: 5

  python-api:
    build:
      context: ./2.RLAC-IAChronicleSegmenter
    environment:
      - DB_HOST=database
      - DB_PORT=5432
      - DB_NAME=radiodb
      - DB_USER=radiouser
      - DB_PASSWORD=radiopass
      - PORT=8001
    ports:
      - "8001:8001"
    depends_on:
      database:
        condition: service_healthy

  backend-java:
    build:
      context: ./1.RLAC-AudioRecorder
    environment:
      - SERVER_PORT=8000
      - PYTHON_API_URL=http://python-api:8001
      - DB_PATH=data/rlac.db
    ports:
      - "8000:8000"
    volumes:
      - ./media:/app/media
    depends_on:
      - python-api

  segmenter:
    build:
      context: ./2.RLAC-IAChronicleSegmenter
    environment:
      - PYTHON_API_URL=http://python-api:8001
    volumes:
      - /tmp:/tmp
    command: python src/live_radio_segmenter.py
    depends_on:
      - python-api

  test-runner:
    image: python:3.11-slim
    volumes:
      - .:/app
    working_dir: /app
    command: >
      bash -c "pip install requests numpy scipy python-socketio && 
               python 6.e2e/test_runner.py"
    depends_on:
      - backend-java
      - python-api

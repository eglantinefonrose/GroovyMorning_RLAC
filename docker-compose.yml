version: '3.8'

services:
  # --- Backend Java (RLAC-AudioRecorder) ---
  # Gère les enregistrements, le planning et l'API pour les apps mobiles
  java-backend:
    build:
      context: ./1.RLAC-AudioRecorder
      dockerfile: Dockerfile
    container_name: rlac-java-backend
    ports:
      - "8000:8000"
    volumes:
      - ./1.RLAC-AudioRecorder/data:/app/data
      - ./1.RLAC-AudioRecorder/media:/app/media
    environment:
      - SERVER_PORT=8000
      - SERVER_HOST=0.0.0.0
      - DB_PATH=/app/data/rlac.db
      - PYTHON_API_URL=http://python-segmenter:8001
    restart: unless-stopped
    networks:
      - rlac-network

  # --- Segmenter Python (RLAC-IAChronicleSegmenter) ---
  # Gère l'analyse IA et le découpage intelligent
  python-segmenter:
    build:
      context: ./2.RLAC-IAChronicleSegmenter
      dockerfile: Dockerfile
    container_name: rlac-python-segmenter
    ports:
      - "8001:8001"
    volumes:
      - ./2.RLAC-IAChronicleSegmenter/data:/app/data
      - ./2.RLAC-IAChronicleSegmenter/assets:/app/assets
    env_file:
      - .env
    environment:
      - JAVA_API_URL=http://java-backend:8000
      - SIMU=${SIMU:-false}
    restart: unless-stopped
    networks:
      - rlac-network

  # --- Cloudflare Tunnel (Accès à Distance) ---
  # Permet d'accéder à l'API Java depuis n'importe où sans ouvrir de ports
  # REMPLACEZ 'YOUR_TOKEN' par votre jeton Cloudflare Tunnel
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: rlac-remote-tunnel
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - java-backend
    networks:
      - rlac-network

networks:
  rlac-network:
    driver: bridge

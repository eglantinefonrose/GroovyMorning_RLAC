services:
  # --- Backend Java (RLAC-AudioRecorder) ---
  # Gère les enregistrements, le planning et l'API pour les apps mobiles
  java-backend:
    build:
      context: ./1.RLAC-AudioRecorder
      dockerfile: Dockerfile
    container_name: rlac-java-backend
    ports:
      - "8000:8000"
    volumes:
      - ./1.RLAC-AudioRecorder/data:/app/data
      - ./1.RLAC-AudioRecorder/media:/app/media
    environment:
      - SERVER_PORT=8000
      - SERVER_HOST=0.0.0.0
      - DB_PATH=/app/data/rlac.db
      - PYTHON_API_URL=http://python-segmenter:8001
    restart: unless-stopped
    networks:
      - rlac-network

  # --- Segmenter Python (RLAC-IAChronicleSegmenter) ---
  # Gère l'analyse IA et le découpage intelligent
  python-segmenter:
    build:
      context: ./2.RLAC-IAChronicleSegmenter
      dockerfile: Dockerfile
    container_name: rlac-python-segmenter
    ports:
      - "8001:8001"
    volumes:
      - ./2.RLAC-IAChronicleSegmenter/data:/app/data
      - ./2.RLAC-IAChronicleSegmenter/assets:/app/assets
      - shared-pipe:/tmp
    env_file:
      - .env
    environment:
      - JAVA_API_URL=http://java-backend:8000
      - SIMU=${SIMU:-false}
      - START_TIME=${START_TIME:-21:57}
      - END_TIME=${END_TIME:-22:00}
      - TZ=Europe/Paris
    restart: unless-stopped
    networks:
      - rlac-network

  # --- Simulateur FFmpeg (Mode SIMU uniquement) ---
  # Envoie le fichier audio dans le pipe pour simuler un flux live
  ffmpeg-simu:
    image: jrottenberg/ffmpeg:latest
    container_name: rlac-ffmpeg-simu
    volumes:
      - ./4.rd/@assets:/data
      - shared-pipe:/tmp
    entrypoint: >
      /bin/sh -c "
      echo '⏳ [Simu] Attente de ${START_TIME:-21:57} pour lancer la simulation...';
      while [ \"\$(date +%H:%M)\" != \"${START_TIME:-21:57}\" ]; do sleep 2; done;
      echo '🚀 [Simu] Heure atteinte ! Lancement du flux audio...';
      ffmpeg -re -i /data/3.modelEvaluationData/france-inter/audio/27-05-2026.m4a -f s16le -ac 1 -ar 16000 -y /tmp/audio_pipe
      "
    environment:
      - TZ=Europe/Paris
    profiles:
      - simu
    networks:
      - rlac-network

  # --- Cloudflare Tunnel (Accès à Distance) ---
  # Permet d'accéder à l'API Java depuis n'importe où sans ouvrir de ports
  # REMPLACEZ 'YOUR_TOKEN' par votre jeton Cloudflare Tunnel
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: rlac-remote-tunnel
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - java-backend
    profiles:
      - tunnel
    networks:
      - rlac-network

networks:
  rlac-network:
    driver: bridge

volumes:
  shared-pipe:
